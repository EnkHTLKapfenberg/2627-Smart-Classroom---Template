name: Aufgabe
description: Geplante Entwicklungs-, Dokumentations- oder Testaufgabe
title: "[TASK] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Beschreibe eine klar abgegrenzte Aufgabe. Der Issue-Status muss dem tatsächlichen Arbeitsstand entsprechen.

  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: Was soll mit dieser Aufgabe erreicht werden?
      placeholder: Beschreibe das konkrete Ergebnis.
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: Zugehörige Anforderung(en)
      description: IDs aus docs/requirements.md, z. B. M03, S01. Falls nicht zutreffend, "keine".
      placeholder: M03
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Geplante technische Umsetzung
      description: Wie soll die Aufgabe gelöst werden?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Arbeitsschritte
      description: Verwende eine Markdown-Checkliste.
      value: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: checkboxes
    id: done
    attributes:
      label: Definition of Done
      description: Vor dem Schließen des Issues müssen die zutreffenden Punkte erfüllt sein.
      options:
        - label: Funktion/Aufgabe umgesetzt
        - label: Ergebnis getestet bzw. kontrolliert
        - label: Änderungen committed und gepusht
        - label: Zugehörige Dokumentation aktualisiert

  - type: textarea
    id: result
    attributes:
      label: Ergebnis / Bemerkungen
      description: Vor dem Schließen kurz festhalten, was tatsächlich umgesetzt wurde und welche Besonderheiten aufgetreten sind.
