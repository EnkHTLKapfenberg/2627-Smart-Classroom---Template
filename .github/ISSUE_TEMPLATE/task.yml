name: Aufgabe
description: Geplante Entwicklungs-, Dokumentations- oder Testaufgabe
title: "[TASK] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Beschreibe ein klar abgegrenztes Arbeitspaket. Verwende Anforderungs-IDs wie REQ-F-01 oder REQ-NF-01.

  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: Welches eindeutige und überprüfbare Ergebnis soll erreicht werden?
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: Betroffene Anforderung
      description: Mindestens eine ID aus docs/requirements.md oder eine kurze Begründung, falls noch keine ID existiert.
      placeholder: "REQ-F-01"
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Geplante Umsetzung
      description: Wie soll die Aufgabe technisch oder organisatorisch gelöst werden?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Arbeitsschritte
      description: Verwende eine konkrete Markdown-Checkliste.
      value: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Abnahmekriterien
      description: Woran ist eindeutig erkennbar, dass die Aufgabe erfüllt ist?
    validations:
      required: true

  - type: textarea
    id: test
    attributes:
      label: Testidee
      description: Wie werden Funktion und Abnahmekriterien geprüft?
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Abhängigkeiten
      description: Welche Issues, Entscheidungen, Dienste oder Personen werden benötigt? Falls keine, "keine".
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Benötigte Hardware
      description: Welche Hardware wird benötigt? Falls keine, "keine".
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Nach dem Erstellen verpflichtend
        Mindestens einen **Assignee**, **genau einen Milestone M1–M6**, passende **Labels** und den aktuellen Status im **GitHub Project** setzen.
