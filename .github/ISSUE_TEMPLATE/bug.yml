name: Fehler / Bug
description: Einen Fehler reproduzierbar dokumentieren
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Dokumentiere den Fehler vollständig. Entferne Geheimnisse und personenbezogene Daten aus Logs.

  - type: textarea
    id: description
    attributes:
      label: Fehlerbeschreibung
      description: Was funktioniert nicht und unter welchen Bedingungen tritt der Fehler auf?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduktionsschritte
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevante Meldungen ohne Passwörter, Tokens, WLAN-Zugangsdaten oder personenbezogene Daten.
      render: shell
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Hardware- und Softwareversion
      description: ESP32-Variante, Sensor-/Aktorhardware, ESPHome- oder Firmwareversion und relevante Dienste.
    validations:
      required: true

  - type: textarea
    id: cause
    attributes:
      label: Vermutete Ursache
      description: Vermutung mit kurzer Begründung; falls unbekannt, "unbekannt".
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Nach dem Erstellen verpflichtend
        Mindestens einen **Assignee**, **genau einen Milestone M1–M6**, passende **Labels** und den aktuellen Status im **GitHub Project** setzen.
